@media (prefers-reduced-motion:reduce){.toast,.sw::after{transition:none}}

  <div class="act"><span>Wie voll ist es gerade?</span>${CROWD.map((x,i)=>`<button class="btn" data-a="rep" data-v="${p.id}:${i}">${x[0]}</button>`).join("")}</div>
  <div class="act"><span>Deine Note</span><select id="r${p.id}" aria-label="Note">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select><button class="btn" data-a="rate" data-v="${p.id}">Bewerten</button></div>
  <div class="act"><input id="t${p.id}" placeholder="Was sollen andere Studis wissen?" aria-label="Kommentar"><button class="btn" data-a="cmt" data-v="${p.id}">Kommentieren</button></div>
  <div class="act"><button class="btn" data-a="acc" data-v="${p.id}">${ac?"Bestätigung zurücknehmen":"Barrierefreiheit bestätigen"}</button>
  <a class="btn p" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.n+" Köln")}&travelmode=transit">Route mit Bus &amp; Bahn</a></div>
  ${cm.map(m=>`<div class="cm"><b>Du</b> · ${esc(m)}</div>`).join("")}</div></article>`}
function mapSvg(L){
  let h='<rect width="360" height="400" fill="var(--land)"/><path d="M255-10C285 80 300 140 262 215S245 330 262 410" stroke="var(--water)" stroke-width="30" fill="none" stroke-linecap="round"/><ellipse cx="110" cy="262" rx="30" ry="14" fill="var(--water)"/><ellipse cx="146" cy="132" rx="30" ry="20" fill="var(--park)"/><ellipse cx="318" cy="180" rx="28" ry="38" fill="var(--park)"/><g stroke="var(--road)" stroke-width="7" fill="none" stroke-linecap="round"><path d="M0 150H235M0 240H250M20 330H250M80 0V400M170 0V400M120 0Q130 200 60 400"/></g><g stroke="var(--line)" stroke-width="1" fill="none"><path d="M0 190H240M0 290H245M130 0V400M30 0V400"/></g><rect x="227" y="150" width="10" height="16" rx="1" fill="var(--mute)"/><text x="232" y="182" font-size="9" text-anchor="middle" fill="var(--mute)">Dom</text><text x="272" y="60" font-size="10" fill="var(--mute)" transform="rotate(75 272 60)">Rhein</text><text x="30" y="378" font-size="9" fill="var(--mute)">Uni</text>';
  L.forEach(p=>{const c=CC[p.c];h+=`<g class="pin${S.sel==p.id?" sel":""}" role="button" tabindex="0" aria-label="${p.n}" data-a="pin" data-v="${p.id}"><circle cx="${p.x}" cy="${p.y}" r="${S.sel==p.id?15:13}" fill="${c[0]}"/><text x="${p.x}" y="${p.y}">${c[1]}</text></g>`});
  return `<svg class="map" viewBox="0 0 360 400" role="group" aria-label="Karte von Köln mit Orten">${h}</svg>`}
function find(){
  const L=list(),sel=P.find(p=>p.id==S.sel);
  return `<div class="row" role="group" aria-label="Kategorie">${CATS.map(c=>`<button class="chip" data-a="cat" data-v="${c[0]}" aria-pressed="${S.cat==c[0]}">${c[1]}</button>`).join("")}</div>
  <div class="panel"><label for="bud">Budget pro Besuch (€)</label><input id="bud" data-i="max" inputmode="decimal" placeholder="Beliebiger Betrag, z. B. 7,50" value="${esc(S.max)}">
  <div class="flags">${FLAGS.map(f=>`<button class="flag" data-a="fl" data-v="${f[0]}" aria-pressed="${S.fl.includes(f[0])}">${f[1]}</button>`).join("")}</div></div>
  <div class="seg" role="group" aria-label="Ansicht"><button data-a="view" data-v="map" aria-pressed="${S.v=="map"}">Karte</button><button data-a="view" data-v="list" aria-pressed="${S.v=="list"}">Liste</button></div>
  ${S.v=="map"?`<div class="mapw">${mapSvg(L)}<div class="count">${L.length} ${L.length==1?"Ort":"Orte"} gefunden${L.length?"":". Lockere einen Filter."}</div>${sel&&L.includes(sel)?card(sel,1):'<div class="meta">Tippe auf einen Pin für Details, Bewertungen und die aktuelle Auslastung.</div>'}</div>`
  :`<div class="list">${L.length?L.map(p=>card(p)).join(""):'<div class="empty">Nichts gefunden. Erhöhe dein Budget oder schalte einen Filter aus.</div>'}</div>`}`}
function today(){
  const ks=["all",...new Set(EV.map(e=>e.k))],d=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  return `<div class="panel"><b>Was geht heute in Köln?</b><div class="meta">${d}</div></div>
  <div class="row" role="group" aria-label="Eventart">${ks.map(k=>`<button class="chip" data-a="evf" data-v="${k}" aria-pressed="${S.evf==k}">${k=="all"?"Alle":k}</button>`).join("")}</div>
  <div class="list">${EV.filter(e=>S.evf=="all"||e.k==S.evf).map(e=>{const f=S.fav.e.includes(e.id);return `<article class="card ev"><div class="time">${e.t}</div><div class="hd"><div style="flex:1"><div class="name">${e.n}</div><div class="meta">${e.a} · ${e.p?eur(e.p):"Gratis"}</div><div class="tags"><span class="tag">${e.k}</span></div></div><button class="fav" data-a="fave" data-v="${e.id}" aria-pressed="${f}" aria-label="${f?"Aus Favoriten entfernen":"Zu Favoriten hinzufügen"}">${heart(f)}</button></div></article>`}).join("")}</div>`}
function calc(){let i=0,o=0;S.items.forEach(x=>{const m=x.a/x.f;x.t=="i"?i+=m:o+=m});return{i,o,left:i-o,pd:(i-o-S.goal)/30}}
function budget(){
  const c=calc(),neg=c.pd<0,pct=Math.min(100,c.o/Math.max(c.i,1)*100);
  const row=x=>`<div class="irow"><span>${esc(x.n)}</span><input id="a${x.id}" data-i="amt" data-v="${x.id}" inputmode="decimal" value="${x.a||""}" placeholder="0" aria-label="Betrag ${esc(x.n)}"><select data-c="frq" data-v="${x.id}" aria-label="Rhythmus">${FRQ.map(f=>`<option value="${f[0]}"${x.f==f[0]?" selected":""}>${f[1]}</option>`).join("")}</select><button class="x" data-a="rm" data-v="${x.id}" aria-label="${esc(x.n)} entfernen">×</button></div>`;
  const pre=(L,t)=>L.filter(n=>!S.items.some(x=>x.n==n)).map(n=>`<button class="flag" data-a="pre" data-v="${t}:${n}">+ ${n}</button>`).join("");
  const sec=(t,l)=>{const it=S.items.filter(x=>x.t==t);return `<div class="panel"><b>${l}</b>${it.map(row).join("")||'<div class="meta">Noch nichts eingetragen.</div>'}<div class="flags">${pre(t=="i"?PI:PE,t)}</div></div>`};
  return `<div class="panel"><div class="meta">Frei pro Tag</div><div class="big" style="color:${neg?"var(--hot)":"var(--acc)"}">${eur(Math.max(0,c.pd))}</div>
  <div class="bar" aria-hidden="true"><i style="width:${pct}%;background:${neg?"var(--hot)":"var(--acc)"}"></i></div>
  <div class="sum"><div>Einnahmen<b>${eur(c.i)}</b></div><div>Ausgaben<b>${eur(c.o)}</b></div><div>Übrig im Monat<b style="color:${c.left<0?"var(--hot)":"var(--ok)"}">${eur(c.left)}</b></div></div>
  <div class="meta" style="margin:10px 0">${c.left<0?"Du gibst mehr aus, als du hast.":"Rechnerisch auf 30 Tage verteilt, nach Abzug deines Sparziels."}</div>
  <button class="btn p" data-a="go" style="margin-top:2px">Orte für ${eur(Math.max(0,c.pd))} finden</button></div>
  ${sec("i","Einnahmen")}${sec("e","Ausgaben")}
  <div class="panel"><b>Eigenen Posten hinzufügen</b><div class="add"><input id="cn" placeholder="Name, z. B. Nachhilfe" aria-label="Name"><input id="ca" inputmode="decimal" placeholder="Betrag" aria-label="Betrag"><select id="ct" aria-label="Art"><option value="e">Ausgabe</option><option value="i">Einnahme</option></select><button class="btn p" data-a="addi">Hinzufügen</button></div></div>
  <div class="panel"><label for="goal">Sparziel pro Monat (€)</label><input id="goal" data-i="goal" inputmode="decimal" value="${S.goal||""}" placeholder="0"></div>`}
function comm(){
  const n=a=>Object.keys(a).length,cn=Object.values(S.cm).reduce((a,b)=>a+b.length,0);
  return `<div class="panel"><b>Community</b><div class="meta" style="margin:0 0 10px">Studis bewerten Orte (1 = sehr gut), melden die Auslastung und teilen Tipps. Deine Beiträge:</div>
  <div class="stats"><div><b>${n(S.mine)}</b><span>Noten</span></div><div><b>${n(S.rep)}</b><span>Meldungen</span></div><div><b>${cn}</b><span>Kommentare</span></div><div><b>${S.sug.length}</b><span>Vorschläge</span></div></div></div>
  <div class="panel"><b>Rabatt-Updates</b>${RAB.map(r=>`<div class="rm"><span>${r}</span></div>`).join("")}<div class="srow"><span>Benachrichtigen</span><button class="sw" role="switch" aria-checked="${S.rab}" aria-label="Rabatt-Updates" data-a="tg" data-v="rab"></button></div></div>
  <div class="panel"><b>Ort vorschlagen</b><div class="add"><input id="sn" placeholder="Name des Ortes" aria-label="Name des Ortes"><input id="sa" placeholder="Viertel" aria-label="Viertel"><select id="sc" aria-label="Kategorie">${CATS.slice(1).map(c=>`<option value="${c[1]}">${c[1]}</option>`).join("")}</select><button class="btn p" data-a="sug">Vorschlag senden</button></div>
  ${S.sug.map(s=>`<div class="rm"><span>${esc(s.n)} <span class="meta">${esc(s.c)}${s.a?" · "+esc(s.a):""}</span></span><span class="st">In Prüfung</span></div>`).join("")}</div>
  <div class="panel"><b>Funktionen</b>${ROAD.map((r,i)=>`<div class="rm"><div><b>${r[0]}</b><span class="st ${r[2]?"ok":""}">${r[2]?"Verfügbar":"Geplant"}</span><div class="meta">${r[1]}</div></div>${r[2]?"":`<button class="btn" data-a="vote" data-v="${i}" aria-pressed="${S.votes.includes(i)}">${S.votes.includes(i)?"Vorgemerkt":"Wünsche ich mir"}</button>`}</div>`).join("")}</div>`}
function me(){
  const u=S.user,sw=(k,l)=>`<div class="srow"><span>${l}</span><button class="sw" role="switch" aria-checked="${S[k]}" aria-label="${l}" data-a="tg" data-v="${k}"></button></div>`;
  const acct=u?`<div class="panel"><div class="who"><span class="av">${esc(u.n[0].toUpperCase())}</span><div><b>${esc(u.n)}</b><div class="meta">${esc(u.e)}</div></div></div><button class="btn" data-a="out">Abmelden</button></div>`
  :`<div class="panel"><div class="seg" role="group" aria-label="Konto"><button data-a="am" data-v="in" aria-pressed="${S.am=="in"}">Anmelden</button><button data-a="am" data-v="up" aria-pressed="${S.am=="up"}">Registrieren</button></div>
  ${S.am=="up"?'<label for="an">Name</label><input id="an" autocomplete="name" style="margin-bottom:10px">':""}<label for="ae">E-Mail</label><input id="ae" type="email" autocomplete="email" style="margin-bottom:10px"><label for="ap">Passwort</label><input id="ap" type="password" autocomplete="${S.am=="up"?"new-password":"current-password"}" style="margin-bottom:12px">
  <button class="btn p" data-a="auth">${S.am=="up"?"Konto erstellen":"Anmelden"}</button><div class="meta">Prototyp: Das Konto wird nur in diesem Browser gespeichert, das Passwort nicht. Favoriten funktionieren auch ohne Konto.</div></div>`;
  const fp=S.fav.p.map(id=>P.find(p=>p.id==id)),fe=S.fav.e.map(id=>EV.find(e=>e.id==id));
  const fr=(n,m,a,v)=>`<div class="rm"><div><b>${n}</b><div class="meta">${m}</div></div><div class="act" style="margin:0">${a?`<button class="btn" data-a="show" data-v="${v}">Ansehen</button>`:""}<button class="fav" data-a="${a?"favp":"fave"}" data-v="${v}" aria-pressed="true" aria-label="Aus Favoriten entfernen">${heart(1)}</button></div></div>`;
  return `${acct}<div class="panel"><b>Favoriten</b>${fp.map(p=>fr(p.n,p.a,1,p.id)).join("")}${fe.map(e=>fr(e.n,e.t+" Uhr · "+e.a,0,e.id)).join("")}${fp.length+fe.length?"":'<div class="meta">Noch keine Favoriten. Tippe bei Orten und Events auf das Herz.</div>'}</div>
  <div class="panel"><b>Einstellungen</b>
  <div class="srow"><label for="th" style="margin:0">Darstellung</label><select id="th" data-c="theme"><option value="auto"${S.theme=="auto"?" selected":""}>System</option><option value="light"${S.theme=="light"?" selected":""}>Hell</option><option value="dark"${S.theme=="dark"?" selected":""}>Dunkel</option></select></div>
  <div class="srow"><label for="db" style="margin:0">Standardbudget pro Besuch (€)</label><input id="db" data-i="defBud" inputmode="decimal" placeholder="egal" value="${esc(S.defBud)}"></div>
  <div class="srow" style="display:block"><span>Standardfilter</span><div class="flags">${FLAGS.map(f=>`<button class="flag" data-a="dfl" data-v="${f[0]}" aria-pressed="${S.defFl.includes(f[0])}">${f[1]}</button>`).join("")}</div></div>
  ${sw("evr","Event-Erinnerungen")}${sw("rab","Rabatt-Updates")}
  <div class="srow"><span>Alle lokalen Daten</span><button class="btn" data-a="wipe">${S.del?"Wirklich löschen?":"Löschen"}</button></div></div>`}
const V={find,today,budget,comm,me};
function render(){
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,y=scrollY;
  $("#main").innerHTML=V[S.t]();
  $("#nav").innerHTML=TABS.map(t=>`<button role="tab" data-a="tab" data-v="${t[0]}" aria-selected="${S.t==t[0]}">${ic(t[0])}${t[1]}</button>`).join("");
  $("#av").innerHTML=S.user?esc(S.user.n[0].toUpperCase()):ic("me",20);
  if(id){const e=document.getElementById(id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
  scrollTo(0,y)}
const tog=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)},it=id=>S.items.find(x=>x.id==id);
const A={
tab(v){S.t=v;S.del=0;render();scrollTo(0,0)},cat(v){S.cat=v;S.sel=null;render()},fl(v){tog(S.fl,v);render()},view(v){S.v=v;render()},
open(v){S.open=S.open==+v?null:+v;render()},pin(v){S.sel=+v;render()},evf(v){S.evf=v;render()},
rep(v){const[i,c]=v.split(":");S.rep[i]=+c;save();toast("Danke für deine Meldung");render()},
rate(v){S.mine[v]=+$("#r"+v).value;save();toast("Bewertung gespeichert");render()},
cmt(v){const t=$("#t"+v).value.trim();if(!t)return toast("Bitte einen Kommentar eingeben");(S.cm[v]=S.cm[v]||[]).unshift(t);save();toast("Kommentar gespeichert");render()},
acc(v){tog(S.acc,+v);save();render()},
favp(v){tog(S.fav.p,+v);save();toast(S.fav.p.includes(+v)?"Zu Favoriten hinzugefügt":"Aus Favoriten entfernt");render()},
fave(v){tog(S.fav.e,+v);save();toast(S.fav.e.includes(+v)?"Zu Favoriten hinzugefügt":"Aus Favoriten entfernt");render()},
show(v){S.t="find";S.cat="all";S.fl=[];S.max="";S.sel=+v;S.open=+v;render();scrollTo(0,0)},
go(){S.max=String(Math.max(0,Math.floor(calc().pd)));S.t="find";save();render();scrollTo(0,0)},
pre(v){const[t,n]=v.split(":");S.items.push({id:Date.now(),n,a:0,t,f:/semester|versicherung|stipendium/i.test(n)?6:1});save();render()},
rm(v){S.items=S.items.filter(x=>x.id!=v);save();render()},
addi(){const n=$("#cn").value.trim();if(!n)return toast("Bitte einen Namen eingeben");S.items.push({id:Date.now(),n,a:num($("#ca").value),t:$("#ct").value,f:1});save();render()},
tg(v){S[v]=!S[v];save();render()},vote(v){tog(S.votes,+v);save();render()},
sug(){const n=$("#sn").value.trim();if(!n)return toast("Bitte einen Namen eingeben");S.sug.unshift({n,a:$("#sa").value.trim(),c:$("#sc").value});save();toast("Vorschlag gesendet");render()},
am(v){S.am=v;render()},
auth(){const e=$("#ae").value.trim(),p=$("#ap").value,n=S.am=="up"?$("#an").value.trim():e.split("@")[0];
 if(!/^\S+@\S+\.\S+$/.test(e))return toast("Bitte eine gültige E-Mail eingeben");if(p.length<6)return toast("Das Passwort braucht mindestens 6 Zeichen");if(!n)return toast("Bitte einen Namen eingeben");
 S.user={n,e};save();render();toast("Angemeldet")},
out(){S.user=null;save();render();toast("Abgemeldet")},
dfl(v){tog(S.defFl,v);save();render()},
wipe(){if(!S.del){S.del=1;return render()}try{localStorage.removeItem(K)}catch(_){}location.reload()}};
const IN={max(v){S.max=v;render()},defBud(v){S.defBud=v;save()},goal(v){S.goal=num(v);save();render()},amt(v,el){const x=it(el.dataset.v);if(x){x.a=num(v);save();render()}}};
const CH={frq(v,el){const x=it(el.dataset.v);if(x){x.f=+v;save();render()}},theme(v){S.theme=v;save();theme()}};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||/INPUT|SELECT/.test(el.tagName))return;A[el.dataset.a](el.dataset.v,el)});
document.addEventListener("keydown",e=>{const el=e.target;if(el.dataset&&el.dataset.a=="pin"&&(e.key=="Enter"||e.key==" ")){e.preventDefault();A.pin(el.dataset.v)}});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset.i)IN[el.dataset.i](el.value,el)});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.c)CH[el.dataset.c](el.value,el)});
theme();render();
</script>
</body>
</html>
